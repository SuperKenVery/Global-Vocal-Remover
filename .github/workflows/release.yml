name: Build and Release

on:
  push:

permissions:
  contents: write

jobs:
  release:
    name: Build macOS app
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true

      - name: Verify model file
        run: |
          if head -n 1 Sources/GlobalVocalRemover/Resources/Models/all_rt.onnx | grep -q 'version https://git-lfs.github.com/spec'; then
            echo "Model file is a Git LFS pointer. The real ONNX model was not checked out." >&2
            exit 1
          fi
          ls -lh Sources/GlobalVocalRemover/Resources/Models/all_rt.onnx

      - name: Build app
        run: ./scripts/build_app.sh

      - name: Package app
        run: |
          cd .build
          ditto -c -k --keepParent GlobalVocalRemover.app GlobalVocalRemover.app.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: build-${{ github.run_number }}-${{ github.sha }}
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          gh release create "$TAG_NAME" \
            .build/GlobalVocalRemover.app.zip \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER} (${SHORT_SHA})" \
            --notes "Automated build for commit ${GITHUB_SHA}."
